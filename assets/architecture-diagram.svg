<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="100%" height="auto">
  <defs>
    <!-- Background Grid -->
    <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>

    <linearGradient id="cardDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <style>
      .hdr { font-size: 20px; font-weight: 800; fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .subhdr { font-size: 12px; font-weight: 500; fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .c-title { font-size: 14px; font-weight: 700; fill: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .c-sub { font-size: 11px; fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .tag { font-size: 9.5px; font-family: 'SFMono-Regular', Consolas, monospace; font-weight: 600; }

      /* GitHub Sanitizer Safe Flow Animation */
      @keyframes dashFlow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }

      @keyframes pulseLight {
        0% { opacity: 0.3; }
        50% { opacity: 1; }
        100% { opacity: 0.3; }
      }

      @keyframes moveAliceToNginx {
        0% { transform: translate(0px, 0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translate(180px, 80px); opacity: 0; }
      }

      @keyframes moveNginxToBackend {
        0% { transform: translate(0px, 0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translate(90px, 0px); opacity: 0; }
      }

      @keyframes moveBackendToBob {
        0% { transform: translate(0px, 0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translate(-180px, 130px); opacity: 0; }
      }

      @keyframes moveBackendToDB {
        0% { transform: translate(0px, 0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translate(170px, -60px); opacity: 0; }
      }

      .flow-green-line { stroke: #4ade80; stroke-width: 2.5; stroke-dasharray: 6 6; animation: dashFlow 1.2s linear infinite; fill: none; }
      .flow-purple-line { stroke: #c084fc; stroke-width: 2.5; stroke-dasharray: 6 6; animation: dashFlow 1.2s linear infinite; fill: none; }
      .flow-cyan-line { stroke: #38bdf8; stroke-width: 2.5; stroke-dasharray: 6 6; animation: dashFlow 1.2s linear infinite; fill: none; }

      .p-alice { animation: moveAliceToNginx 2.2s linear infinite; }
      .p-ng-be { animation: moveNginxToBackend 1.2s linear 0.7s infinite; }
      .p-be-bob { animation: moveBackendToBob 2.2s linear 1.4s infinite; }
      .p-be-db { animation: moveBackendToDB 1.8s linear 1s infinite; }

      .beacon-arch { animation: pulseLight 2s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1280" height="560" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
  <rect width="1280" height="560" fill="url(#archGrid)" />

  <!-- Header -->
  <g transform="translate(45, 45)">
    <circle cx="12" cy="12" r="10" fill="#4ade80" class="beacon-arch"/>
    <circle cx="12" cy="12" r="5" fill="#ffffff"/>
    <text x="36" y="16" class="hdr">Real-Time Application Architecture &amp; Data Pipeline</text>
    <text x="36" y="34" class="subhdr">Bi-Directional WebSocket Streaming &bull; REST API Microservices &bull; MongoDB Persistence &bull; Cloudinary Media</text>
  </g>

  <!-- ================= STATIC & FLOWING PATHS ================= -->
  <!-- Client A to Nginx -->
  <path d="M 200 170 C 270 170, 310 240, 380 250" class="flow-green-line" />
  <!-- Client B to Nginx -->
  <path d="M 200 410 C 270 410, 310 320, 380 300" class="flow-purple-line" />

  <!-- Nginx to Express Backend -->
  <path d="M 490 275 L 580 275" class="flow-green-line" />

  <!-- Express to MongoDB -->
  <path d="M 850 240 C 930 240, 950 180, 1020 180" class="flow-green-line" />

  <!-- Express to Cloudinary -->
  <path d="M 850 310 C 930 310, 950 380, 1020 380" class="flow-cyan-line" />

  <!-- Direct Peer WebSocket Return Loop (Nginx to Bob) -->
  <path d="M 380 295 C 290 295, 260 380, 200 430" class="flow-green-line" />


  <!-- ================= MOVING DOTS ================= -->
  <!-- Alice to Nginx -->
  <g transform="translate(200, 170)">
    <g class="p-alice">
      <circle cx="0" cy="0" r="5" fill="#4ade80" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>
  </g>

  <!-- Nginx to Backend -->
  <g transform="translate(490, 275)">
    <g class="p-ng-be">
      <circle cx="0" cy="0" r="5" fill="#4ade80" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>
  </g>

  <!-- Return Broadcast to Bob -->
  <g transform="translate(380, 295)">
    <g class="p-be-bob">
      <circle cx="0" cy="0" r="5" fill="#4ade80" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>
  </g>

  <!-- Backend to MongoDB -->
  <g transform="translate(850, 240)">
    <g class="p-be-db">
      <circle cx="0" cy="0" r="4.5" fill="#10b981" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
    </g>
  </g>


  <!-- ================= CLIENT TIER ================= -->
  <!-- Client 1: User A -->
  <g transform="translate(50, 110)">
    <rect width="150" height="120" rx="12" fill="url(#cardDark)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#38bdf8" fill-opacity="0.15"/>
    <circle cx="30" cy="30" r="6" fill="#38bdf8"/>
    <text x="54" y="28" class="c-title">Client A (Alice)</text>
    <text x="54" y="42" font-size="10px" fill="#4ade80">● Online / Connected</text>
    <text x="20" y="70" class="c-sub">React 18 + Vite</text>
    <text x="20" y="86" class="c-sub">Zustand State Store</text>
    <rect x="20" y="94" width="110" height="16" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="75" y="105" text-anchor="middle" fill="#38bdf8" class="tag">Socket.io-client</text>
  </g>

  <!-- Client 2: User B -->
  <g transform="translate(50, 350)">
    <rect width="150" height="120" rx="12" fill="url(#cardDark)" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#c084fc" fill-opacity="0.15"/>
    <circle cx="30" cy="30" r="6" fill="#c084fc"/>
    <text x="54" y="28" class="c-title">Client B (Bob)</text>
    <text x="54" y="42" font-size="10px" fill="#4ade80">● Online / Connected</text>
    <text x="20" y="70" class="c-sub">React 18 + Vite</text>
    <text x="20" y="86" class="c-sub">Tailwind + DaisyUI</text>
    <rect x="20" y="94" width="110" height="16" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="75" y="105" text-anchor="middle" fill="#c084fc" class="tag">Socket.io-client</text>
  </g>

  <!-- ================= PROXY / INGRESS TIER ================= -->
  <g transform="translate(380, 205)">
    <rect width="110" height="140" rx="12" fill="url(#cardDark)" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="55" cy="35" r="18" fill="#10b981" fill-opacity="0.1" stroke="#10b981"/>
    <text x="55" y="39" text-anchor="middle" font-size="11px" font-weight="800" fill="#10b981">NGINX</text>
    <text x="55" y="72" text-anchor="middle" class="c-title" font-size="13px">Reverse Proxy</text>
    <text x="55" y="88" text-anchor="middle" class="c-sub" font-size="10px">Ingress Route</text>
    <rect x="15" y="98" width="80" height="16" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="55" y="109" text-anchor="middle" fill="#10b981" class="tag">Port 80/8080</text>
    <rect x="15" y="117" width="80" height="15" rx="4" fill="#064e3b"/>
    <text x="55" y="128" text-anchor="middle" fill="#a7f3d0" font-size="8.5px" font-weight="700">WS UPGRADE</text>
  </g>

  <!-- ================= APPLICATION TIER ================= -->
  <g transform="translate(580, 145)">
    <rect width="270" height="260" rx="16" fill="url(#cardDark)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="38" rx="16" fill="#1e293b" fill-opacity="0.8"/>
    <path d="M 0 38 L 270 38" stroke="#334155" stroke-width="1"/>
    
    <circle cx="22" cy="19" r="5" fill="#3b82f6" class="beacon-arch"/>
    <text x="36" y="23" font-size="13px" font-weight="700" fill="#f8fafc">Node.js Express &amp; Socket.io</text>
    <text x="210" y="23" font-size="10px" font-family="monospace" fill="#38bdf8">PORT: 5001</text>

    <!-- Sub Module 1 -->
    <g transform="translate(18, 50)">
      <rect width="234" height="48" rx="8" fill="#0f172a" stroke="#334155"/>
      <circle cx="16" cy="24" r="5" fill="#38bdf8"/>
      <text x="30" y="22" font-size="11px" font-weight="700" fill="#f8fafc">Auth &amp; JWT Verification</text>
      <text x="30" y="36" font-size="9.5px" fill="#94a3b8">HTTP-only cookie &bull; bcrypt password hash</text>
    </g>

    <!-- Sub Module 2 -->
    <g transform="translate(18, 108)">
      <rect width="234" height="60" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.2"/>
      <circle cx="16" cy="24" r="5" fill="#4ade80" class="beacon-arch"/>
      <text x="30" y="22" font-size="11px" font-weight="700" fill="#4ade80">Socket.io Engine</text>
      <text x="30" y="36" font-size="9.5px" fill="#cbd5e1">userSocketMap: { userId &rarr; socketId }</text>
      <text x="30" y="49" font-size="9px" fill="#94a3b8">getOnlineUsers &bull; newMessage emit</text>
    </g>

    <!-- Sub Module 3 -->
    <g transform="translate(18, 178)">
      <rect width="234" height="48" rx="8" fill="#0f172a" stroke="#334155"/>
      <circle cx="16" cy="24" r="5" fill="#fbbf24"/>
      <text x="30" y="22" font-size="11px" font-weight="700" fill="#f8fafc">Message &amp; Health Controller</text>
      <text x="30" y="36" font-size="9.5px" fill="#94a3b8">/api/messages &bull; /health endpoint (k8s)</text>
    </g>

    <text x="135" y="246" text-anchor="middle" font-size="9px" fill="#64748b">Clustered in Docker / Kubernetes Pod with Liveness Probe</text>
  </g>

  <!-- ================= DATABASE & STORAGE TIER ================= -->
  <!-- MongoDB -->
  <g transform="translate(1020, 115)">
    <rect width="210" height="135" rx="12" fill="url(#cardDark)" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="14" fill="#10b981" fill-opacity="0.15"/>
    <path d="M 32 20 C 35 24, 38 29, 32 40 C 26 29, 29 24, 32 20 Z" fill="#10b981"/>
    <text x="56" y="28" class="c-title">MongoDB Database</text>
    <text x="56" y="42" font-size="10px" fill="#34d399">Port 27017 &bull; Replica / PV</text>
    <text x="20" y="70" class="c-sub">&bull; users: { username, email, pic }</text>
    <text x="20" y="88" class="c-sub">&bull; messages: { sender, receiver, text }</text>
    <rect x="20" y="98" width="170" height="20" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="105" y="112" text-anchor="middle" fill="#10b981" class="tag">K8s PVC: mongodb-pvc</text>
  </g>

  <!-- Cloudinary -->
  <g transform="translate(1020, 315)">
    <rect width="210" height="135" rx="12" fill="url(#cardDark)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="14" fill="#38bdf8" fill-opacity="0.15"/>
    <path d="M 24 34 C 24 28, 30 25, 34 26 C 36 22, 42 22, 44 26 C 47 26, 49 30, 47 34 Z" fill="#38bdf8"/>
    <text x="56" y="28" class="c-title">Cloudinary CDN</text>
    <text x="56" y="42" font-size="10px" fill="#38bdf8">Cloud Media Storage</text>
    <text x="20" y="72" class="c-sub">&bull; User Profile Avatars</text>
    <text x="20" y="90" class="c-sub">&bull; Chat Shared Media &amp; Images</text>
    <rect x="20" y="100" width="170" height="20" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="105" y="114" text-anchor="middle" fill="#38bdf8" class="tag">Secure Cloud API</text>
  </g>

  <!-- Footer Legend -->
  <g transform="translate(60, 520)">
    <circle cx="0" cy="0" r="4.5" fill="#4ade80" />
    <text x="12" y="4" font-size="11px" fill="#94a3b8">Real-Time WebSocket Message Stream (Instant Delivery)</text>
    
    <circle cx="360" cy="0" r="4.5" fill="#c084fc"/>
    <text x="372" y="4" font-size="11px" fill="#94a3b8">User Status &amp; Typing Indicator Ack</text>

    <circle cx="640" cy="0" r="4.5" fill="#10b981"/>
    <text x="652" y="4" font-size="11px" fill="#94a3b8">MongoDB Persistence Storage</text>

    <circle cx="900" cy="0" r="4.5" fill="#38bdf8"/>
    <text x="912" y="4" font-size="11px" fill="#94a3b8">REST Auth &amp; Cloudinary Asset Pipeline</text>
  </g>
</svg>