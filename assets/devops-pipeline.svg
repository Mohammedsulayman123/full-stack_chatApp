<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:12px; box-shadow:0 20px 40px rgba(0,0,0,0.6);">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Connectors Paths for Moving Dots -->
    <!-- Dev to GitHub -->
    <path id="flow-dev-git" d="M 180 250 L 250 250" fill="none" />
    
    <!-- GitHub to Jenkins -->
    <path id="flow-git-jenkins" d="M 370 250 L 440 250" fill="none" />
    
    <!-- Jenkins Internal Stages -->
    <path id="flow-j-1-2" d="M 525 210 L 525 255" fill="none" />
    <path id="flow-j-2-3" d="M 525 295 L 525 340" fill="none" />
    
    <!-- Jenkins to Docker Registry -->
    <path id="flow-jenkins-docker" d="M 610 250 L 680 250" fill="none" />
    
    <!-- Docker Registry to K8s Ingress -->
    <path id="flow-docker-k8s" d="M 800 250 L 870 250" fill="none" />
    
    <!-- Ingress Branch to Frontend -->
    <path id="flow-ing-fe" d="M 970 230 C 1000 230, 1010 180, 1040 180" fill="none" />
    
    <!-- Ingress Branch to Backend -->
    <path id="flow-ing-be" d="M 970 270 C 1000 270, 1010 320, 1040 320" fill="none" />

    <!-- Backend to Mongo -->
    <path id="flow-be-mongo" d="M 1160 320 L 1200 320" fill="none" />

    <style>
      .title { font-size: 20px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px; }
      .subtitle { font-size: 12px; font-weight: 500; fill: #94a3b8; }
      .badge-text { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .card-title { font-size: 14px; font-weight: 700; fill: #f1f5f9; }
      .card-desc { font-size: 11px; fill: #94a3b8; }
      .metric { font-size: 11px; font-family: monospace; font-weight: 600; fill: #38bdf8; }
      .node-border { stroke: #334155; stroke-width: 1.5; rx: 10; }
      .pulse-ring { animation: pulse 2.5s infinite cubic-bezier(0.4, 0, 0.6, 1); transform-origin: center; }
      @keyframes pulse {
        0% { r: 6px; opacity: 0.9; }
        50% { r: 14px; opacity: 0; }
        100% { r: 6px; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="500" fill="#0b0f19" />
  <rect width="1280" height="500" fill="url(#grid)" />

  <!-- Top Header Banner -->
  <g transform="translate(40, 45)">
    <circle cx="12" cy="12" r="12" fill="#38bdf8" fill-opacity="0.15"/>
    <circle cx="12" cy="12" r="6" fill="#38bdf8" filter="url(#glow-cyan)"/>
    <text x="36" y="16" class="title">DevOps CI/CD Automation &amp; Kubernetes Deployment Pipeline</text>
    <text x="36" y="34" class="subtitle">Live Visualization &bull; Automated Build, Test, Containerization &amp; Rolling Deployment</text>
    
    <!-- Status Badges right aligned -->
    <g transform="translate(930, -5)">
      <rect width="90" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
      <circle cx="15" cy="13" r="4" fill="#34d399" filter="url(#glow-green)"/>
      <text x="26" y="17" fill="#34d399" class="badge-text">PIPELINE: OK</text>
    </g>
    <g transform="translate(1030, -5)">
      <rect width="95" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
      <circle cx="15" cy="13" r="4" fill="#38bdf8" filter="url(#glow-cyan)"/>
      <text x="26" y="17" fill="#38bdf8" class="badge-text">K8S CLUSTER</text>
    </g>
    <g transform="translate(1135, -5)">
      <rect width="70" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
      <circle cx="15" cy="13" r="4" fill="#fbbf24" filter="url(#glow-amber)"/>
      <text x="26" y="17" fill="#fbbf24" class="badge-text">LIVE</text>
    </g>
  </g>

  <!-- ================= PIPELINE STATIC PATHS ================= -->
  <g stroke="#334155" stroke-width="2.5" stroke-dasharray="4,4" fill="none">
    <path d="M 180 250 L 250 250" />
    <path d="M 370 250 L 440 250" />
    <path d="M 610 250 L 680 250" />
    <path d="M 800 250 L 870 250" />
    <path d="M 970 230 C 1000 230, 1010 180, 1040 180" />
    <path d="M 970 270 C 1000 270, 1010 320, 1040 320" />
    <path d="M 1160 320 L 1200 320" />
  </g>

  <!-- ================= STAGE 1: DEVELOPER ================= -->
  <g transform="translate(50, 185)">
    <rect width="130" height="130" rx="12" fill="url(#cardGrad)" class="node-border" stroke="#38bdf8" stroke-opacity="0.6"/>
    <!-- Icon Circle -->
    <circle cx="65" cy="40" r="22" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Developer Icon -->
    <path d="M 55 45 C 55 37, 75 37, 75 45 Z M 65 35 A 5 5 0 1 0 65 25 A 5 5 0 1 0 65 35 Z" fill="#38bdf8"/>
    <text x="65" y="78" text-anchor="middle" class="card-title">Developer</text>
    <text x="65" y="96" text-anchor="middle" class="card-desc">Local Workspace</text>
    <rect x="25" y="104" width="80" height="18" rx="9" fill="#0f172a" stroke="#334155"/>
    <text x="65" y="116" text-anchor="middle" class="metric">git push</text>
  </g>

  <!-- ================= STAGE 2: GIT REPOSITORY ================= -->
  <g transform="translate(250, 185)">
    <rect width="120" height="130" rx="12" fill="url(#cardGrad)" class="node-border" stroke="#c084fc" stroke-opacity="0.6"/>
    <!-- Icon Circle -->
    <circle cx="60" cy="40" r="22" fill="#c084fc" fill-opacity="0.1" stroke="#c084fc" stroke-width="1.5"/>
    <!-- Git Branch Icon -->
    <path d="M 54 32 A 3 3 0 1 0 54 26 A 3 3 0 1 0 54 32 Z M 66 38 A 3 3 0 1 0 66 32 A 3 3 0 1 0 66 38 Z M 54 52 A 3 3 0 1 0 54 46 A 3 3 0 1 0 54 52 Z M 54 32 L 54 46 M 54 38 C 58 38, 66 36, 66 38" stroke="#c084fc" stroke-width="2" fill="none"/>
    <text x="60" y="78" text-anchor="middle" class="card-title">GitHub Repo</text>
    <text x="60" y="96" text-anchor="middle" class="card-desc">branch: master</text>
    <rect x="20" y="104" width="80" height="18" rx="9" fill="#0f172a" stroke="#334155"/>
    <text x="60" y="116" text-anchor="middle" fill="#c084fc" class="metric">webhook</text>
  </g>

  <!-- ================= STAGE 3: JENKINS PIPELINE CONTAINER ================= -->
  <g transform="translate(440, 130)">
    <!-- Container Box -->
    <rect width="170" height="240" rx="14" fill="url(#cardGrad)" class="node-border" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="36" rx="14" fill="#1e293b" fill-opacity="0.7"/>
    <path d="M 0 36 L 170 36" stroke="#334155" stroke-width="1"/>
    
    <!-- Header -->
    <circle cx="20" cy="18" r="6" fill="#3b82f6" filter="url(#glow-cyan)"/>
    <text x="35" y="22" class="card-title" font-size="12px">Jenkins Pipeline</text>

    <!-- Sub-step 1: Checkout -->
    <g transform="translate(15, 48)">
      <rect width="140" height="48" rx="8" fill="#0f172a" stroke="#334155"/>
      <circle cx="16" cy="24" r="5" fill="#34d399"/>
      <text x="30" y="22" font-size="11px" font-weight="700" fill="#f8fafc">1. Checkout</text>
      <text x="30" y="36" font-size="9px" fill="#94a3b8">Fetch latest code</text>
    </g>

    <!-- Sub-step 2: Test -->
    <g transform="translate(15, 108)">
      <rect width="140" height="48" rx="8" fill="#0f172a" stroke="#334155"/>
      <circle cx="16" cy="24" r="5" fill="#38bdf8"/>
      <text x="30" y="22" font-size="11px" font-weight="700" fill="#f8fafc">2. Smoke Test</text>
      <text x="30" y="36" font-size="9px" fill="#94a3b8">curl /health verify</text>
    </g>

    <!-- Sub-step 3: Deploy/Build -->
    <g transform="translate(15, 168)">
      <rect width="140" height="54" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-dasharray="3,3"/>
      <circle cx="16" cy="24" r="5" fill="#fbbf24"/>
      <text x="30" y="22" font-size="11px" font-weight="700" fill="#f8fafc">3. Docker Build</text>
      <text x="30" y="36" font-size="9px" fill="#94a3b8">Multi-stage alpine</text>
      <text x="30" y="47" font-size="8.5px" fill="#fbbf24">docker-compose</text>
    </g>
  </g>

  <!-- ================= STAGE 4: DOCKER HUB REGISTRY ================= -->
  <g transform="translate(680, 185)">
    <rect width="120" height="130" rx="12" fill="url(#cardGrad)" class="node-border" stroke="#38bdf8" stroke-opacity="0.6"/>
    <!-- Docker Whale Symbol -->
    <circle cx="60" cy="40" r="22" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="46" y="36" width="6" height="5" rx="1" fill="#38bdf8"/>
    <rect x="54" y="36" width="6" height="5" rx="1" fill="#38bdf8"/>
    <rect x="62" y="36" width="6" height="5" rx="1" fill="#38bdf8"/>
    <rect x="54" y="29" width="6" height="5" rx="1" fill="#38bdf8"/>
    <rect x="62" y="29" width="6" height="5" rx="1" fill="#38bdf8"/>
    <path d="M 43 43 C 48 48, 72 48, 77 43" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <text x="60" y="78" text-anchor="middle" class="card-title">Docker Hub</text>
    <text x="60" y="96" text-anchor="middle" class="card-desc">sulayman12/*</text>
    <rect x="18" y="104" width="84" height="18" rx="9" fill="#0f172a" stroke="#334155"/>
    <text x="60" y="116" text-anchor="middle" class="metric">tag: latest</text>
  </g>

  <!-- ================= STAGE 5: KUBERNETES CLUSTER CLOUD ================= -->
  <g transform="translate(860, 110)">
    <!-- Boundary Box -->
    <rect width="380" height="280" rx="16" fill="#0c1322" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,4" fill-opacity="0.7"/>
    <rect x="15" y="-12" width="180" height="24" rx="12" fill="#1e293b" stroke="#3b82f6"/>
    <text x="105" y="4" text-anchor="middle" font-size="11px" font-weight="700" fill="#38bdf8">K8s Namespace: chat-app</text>

    <!-- Ingress Node -->
    <g transform="translate(20, 105)">
      <rect width="90" height="70" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="45" y="28" text-anchor="middle" class="card-title" font-size="12px">Ingress</text>
      <text x="45" y="44" text-anchor="middle" class="card-desc" font-size="9px">Nginx Controller</text>
      <text x="45" y="58" text-anchor="middle" font-size="8.5px" fill="#38bdf8">chat-tws.com</text>
    </g>

    <!-- Frontend Pod -->
    <g transform="translate(180, 35)">
      <rect width="120" height="65" rx="8" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="16" cy="18" r="4" fill="#34d399" filter="url(#glow-green)"/>
      <text x="26" y="22" font-size="11px" font-weight="700" fill="#f8fafc">Frontend Pod</text>
      <text x="15" y="40" class="card-desc" font-size="9px">React + Vite + DaisyUI</text>
      <text x="15" y="55" font-size="9px" fill="#34d399" font-family="monospace">Port: 80 / ClusterIP</text>
    </g>

    <!-- Backend Pod -->
    <g transform="translate(180, 175)">
      <rect width="120" height="65" rx="8" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="1.5"/>
      <circle cx="16" cy="18" r="4" fill="#fbbf24" filter="url(#glow-amber)"/>
      <text x="26" y="22" font-size="11px" font-weight="700" fill="#f8fafc">Backend Pod</text>
      <text x="15" y="40" class="card-desc" font-size="9px">Node + Socket.io + JWT</text>
      <text x="15" y="55" font-size="9px" fill="#fbbf24" font-family="monospace">Port: 5001 / Health</text>
    </g>

    <!-- MongoDB Pod + PVC -->
    <g transform="translate(320, 175)">
      <rect width="50" height="65" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
      <text x="25" y="25" text-anchor="middle" font-size="10px" font-weight="700" fill="#34d399">Mongo</text>
      <text x="25" y="40" text-anchor="middle" font-size="8px" fill="#94a3b8">Pod</text>
      <rect x="5" y="48" width="40" height="12" rx="4" fill="#047857"/>
      <text x="25" y="57" text-anchor="middle" font-size="7.5px" font-weight="700" fill="#ffffff">PVC</text>
    </g>
  </g>

  <!-- ================= ANIMATED MOVING DOTS (LIVE PIPELINE EFFECT) ================= -->
  <!-- Dev to GitHub: Cyan packet 1 -->
  <circle r="4.5" fill="#38bdf8" filter="url(#glow-cyan)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 180 250 L 250 250" />
  </circle>
  <circle r="3" fill="#ffffff">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 180 250 L 250 250" />
  </circle>

  <!-- GitHub to Jenkins: Purple packet -->
  <circle r="4.5" fill="#c084fc" filter="url(#glow-cyan)">
    <animateMotion dur="1.8s" begin="0.4s" repeatCount="indefinite" path="M 370 250 L 440 250" />
  </circle>
  <circle r="3" fill="#ffffff">
    <animateMotion dur="1.8s" begin="0.4s" repeatCount="indefinite" path="M 370 250 L 440 250" />
  </circle>

  <!-- Jenkins internal progress: Stage 1 to 2 -->
  <circle r="3.5" fill="#34d399" filter="url(#glow-green)">
    <animateMotion dur="1.2s" begin="0.2s" repeatCount="indefinite" path="M 525 225 L 525 255" />
  </circle>
  <!-- Jenkins internal progress: Stage 2 to 3 -->
  <circle r="3.5" fill="#fbbf24" filter="url(#glow-amber)">
    <animateMotion dur="1.2s" begin="0.6s" repeatCount="indefinite" path="M 525 285 L 525 315" />
  </circle>

  <!-- Jenkins to Docker Hub: Amber packet -->
  <circle r="4.5" fill="#fbbf24" filter="url(#glow-amber)">
    <animateMotion dur="1.8s" begin="0.8s" repeatCount="indefinite" path="M 610 250 L 680 250" />
  </circle>
  <circle r="3" fill="#ffffff">
    <animateMotion dur="1.8s" begin="0.8s" repeatCount="indefinite" path="M 610 250 L 680 250" />
  </circle>

  <!-- Docker Hub to K8s Ingress: Blue packet -->
  <circle r="4.5" fill="#38bdf8" filter="url(#glow-cyan)">
    <animateMotion dur="1.8s" begin="1.2s" repeatCount="indefinite" path="M 800 250 L 870 250" />
  </circle>
  <circle r="3" fill="#ffffff">
    <animateMotion dur="1.8s" begin="1.2s" repeatCount="indefinite" path="M 800 250 L 870 250" />
  </circle>

  <!-- Ingress to Frontend: Green moving stream -->
  <circle r="4" fill="#34d399" filter="url(#glow-green)">
    <animateMotion dur="2.2s" begin="0.3s" repeatCount="indefinite" path="M 970 230 C 1000 230, 1010 180, 1040 180" />
  </circle>
  <circle r="4" fill="#34d399" filter="url(#glow-green)">
    <animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite" path="M 970 230 C 1000 230, 1010 180, 1040 180" />
  </circle>

  <!-- Ingress to Backend: Amber moving stream -->
  <circle r="4" fill="#fbbf24" filter="url(#glow-amber)">
    <animateMotion dur="2.2s" begin="0.6s" repeatCount="indefinite" path="M 970 270 C 1000 270, 1010 320, 1040 320" />
  </circle>
  <circle r="4" fill="#fbbf24" filter="url(#glow-amber)">
    <animateMotion dur="2.2s" begin="1.7s" repeatCount="indefinite" path="M 970 270 C 1000 270, 1010 320, 1040 320" />
  </circle>

  <!-- Backend to Mongo: Database sync stream -->
  <circle r="3.5" fill="#10b981" filter="url(#glow-green)">
    <animateMotion dur="1.5s" begin="0.5s" repeatCount="indefinite" path="M 1160 320 L 1200 320" />
  </circle>

  <!-- ================= PULSE RINGS ON ACTIVE NODES ================= -->
  <circle cx="115" cy="225" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5" class="pulse-ring"/>
  <circle cx="310" cy="225" r="8" fill="none" stroke="#c084fc" stroke-width="1.5" class="pulse-ring"/>
  <circle cx="740" cy="225" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5" class="pulse-ring"/>

  <!-- Footer Legend -->
  <g transform="translate(60, 455)">
    <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
    <text x="12" y="4" font-size="11px" fill="#94a3b8">Git &amp; Deployment Artifacts</text>
    
    <circle cx="180" cy="0" r="4" fill="#c084fc"/>
    <text x="192" y="4" font-size="11px" fill="#94a3b8">Webhook Trigger</text>

    <circle cx="320" cy="0" r="4" fill="#fbbf24"/>
    <text x="332" y="4" font-size="11px" fill="#94a3b8">Container Build / Test</text>

    <circle cx="490" cy="0" r="4" fill="#34d399"/>
    <text x="502" y="4" font-size="11px" fill="#94a3b8">Kubernetes Pod Routing &amp; Sync</text>
  </g>
</svg>
