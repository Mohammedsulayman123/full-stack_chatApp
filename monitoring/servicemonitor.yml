apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: chatapp-backend-monitor
  namespace: chat-app
  labels:
    app: backend
    release: prometheus
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
